name: Compilar Mink Launcher

on:
  workflow_dispatch: # Esto activa el boton manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo de Mink
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK resultante
        uses: actions/upload-artifact@v4
        with:
          name: MinkLauncher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
